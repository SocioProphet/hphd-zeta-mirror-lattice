[project]
name = "hphd-zeta-mirror-lattice"
version = "0.1.0"
description = "HPHD zeta mirror-lattice manuscripts and reproducible analytic-number-theory experiments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SocioProphet" }]
dependencies = [
  "mpmath>=1.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
